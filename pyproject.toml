[project]
name = "vgi-docgen"
version = "0.1.0"
description = "Mail-merge SQL data into DOCX templates -> filled documents (DOCX/PDF) as BLOBs for DuckDB via VGI"
readme = "README.md"
keywords = [
    "duckdb",
    "apache-arrow",
    "vgi",
    "sql",
    "docx",
    "mail-merge",
    "template",
    "document-generation",
    "docxtpl",
    "jinja2",
]
license = { file = "LICENSE" }
authors = [{ name = "Query Farm LLC", email = "hello@query.farm" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "vgi-python>=0.8.5",
    "docxtpl>=0.16",
    "docxcompose>=1.4",
    "python-docx>=1.1",
    "pyarrow",
]

[project.optional-dependencies]
# HTTP serving (`vgi-docgen --http`) needs waitress, pulled in by the
# `vgi-python[http]` extra. Kept as a separate optional extra so the default
# install (and the stdio/subprocess + unix transports) stays lean; the CI
# integration job installs it with `uv sync --extra http` for the http leg.
http = [
    "vgi-python[http]>=0.8.5",
]
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
    "pydoclint",
]

[project.scripts]
vgi-docgen = "vgi_docgen.worker:main"
vgi-docgen-http = "vgi_docgen.worker:main_http"

[project.urls]
Homepage = "https://query.farm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vgi_docgen"]

[tool.hatch.build.targets.sdist]
include = [
    "vgi_docgen/",
    "docgen_worker.py",
    "conftest.py",
    "tests/",
    "test/",
    "README.md",
    "CLAUDE.md",
    "LICENSE",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pydoclint]
style = "google"
arg_type_hints_in_docstring = false
check_return_types = false
check_yield_types = false
check_class_attributes = true
skip_checking_raises = true
allow_init_docstring = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["docxtpl.*", "docxcompose.*", "docx.*"]
ignore_missing_imports = true
