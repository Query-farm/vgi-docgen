# Private graders for `vgi-lint simulate` (VGI416). The worker publishes only
# task names and prompts in vgi.agent_test_tasks; these canonical solutions and
# grading options stay in the repo and are merged by task name.
tasks:
  - name: render_from_sample_template
    # The sample template path is machine-specific, so look it up from the catalog.
    reference_sql: "SELECT octet_length(docgen.main.docgen_render((SELECT path FROM docgen.main.sample_templates WHERE name = 'sample_invoice'), {customer: 'Ada Lovelace', total: '99.50'})) > 0 AS document_produced"
    ignore_column_names: true
  - name: null_template_is_null
    reference_sql: "SELECT docgen.main.docgen_render(NULL::VARCHAR, {customer: 'Ada'}) IS NULL AS is_null"
    ignore_column_names: true
  - name: empty_merge_yields_no_rows
    reference_sql: "SELECT count(*) AS n FROM docgen.main.docgen_merge((SELECT 'Ada' AS customer WHERE false), template := 'invoice.docx')"
    ignore_column_names: true
  - name: discover_sample_templates
    reference_sql: "SELECT count(*) AS n FROM docgen.main.sample_templates"
    ignore_column_names: true
  - name: sample_template_fields
    reference_sql: "SELECT fields = 'customer, total' AS ok FROM docgen.main.sample_templates WHERE name = 'sample_invoice'"
    ignore_column_names: true
  - name: render_with_per_row_template
    # Composes sample_templates (path lookup by name) with docgen_render. A LEFT
    # JOIN keeps the order naming the non-existent 'sample_letter' (its NULL path
    # renders to NULL -> produced=false); an inner join drops it and fails.
    reference_sql: "WITH orders AS (SELECT * FROM (VALUES ('Ada Lovelace', 'sample_invoice', '99.50'), ('Grace Hopper', 'sample_letter', '42.00'), ('Alan Turing', 'sample_invoice', '12.75')) AS t(customer, template_name, total)) SELECT o.customer, docgen.main.docgen_render(t.path, {customer: o.customer, total: o.total}) IS NOT NULL AS produced FROM orders AS o LEFT JOIN docgen.main.sample_templates AS t ON t.name = o.template_name ORDER BY o.customer"
    ignore_column_names: true
